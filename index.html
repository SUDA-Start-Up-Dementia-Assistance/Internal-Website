<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Set the theme before any CSS loads, so the first paint is already right. Mirrors
         src/lib/theme/theme.ts (preference in localStorage "theme"; "system" follows the OS). -->
    <script>
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          try {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (e) {
            t = 'light'
          }
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1E2140" />
    <meta
      name="description"
      content="Meeting agendas, 4Ups, and project artifacts for the D.A.W.N. senior project team."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>D.A.W.N. Team</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
